name: sequence system tests

on:
  pull_request:
    paths:
      - "cmd/sequence/**"
      - "configs/sequence.yaml"
      - "internal/sequence/**"
      - "migrations/sequence/**"
      - "tests/sequence/**"
      - "pkg/sequence/**"
      - "api/sindri/sequence/**"
      - "gen/go/sequence/**"
      - "internal/pkg/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "Taskfile.yml"
      - "scripts/**"
      - "tools/service-release-check/**"
      - "releases/services/sequence.yaml"
      - ".github/workflows/sequence-system-tests.yml"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sequence-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mysql: ${{ steps.filter.outputs.mysql }}
      chaos: ${{ steps.filter.outputs.chaos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mysql:
              - 'internal/sequence/data/**'
              - 'internal/pkg/xgorm/**'
              - 'migrations/sequence/mysql/**'
              - 'tests/sequence/*mysql*'
              - 'tests/sequence/*MySQL*'
              - 'tests/sequence/**/*mysql*'
              - 'tests/sequence/**/*MySQL*'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
            # The chaos suite kills, restarts and partitions real node containers, so
            # it is the only place the failover and fencing paths are exercised end
            # to end. It runs on a change to any of those paths rather than on every
            # pull request: it is a 60-minute matrix, and a change that cannot reach
            # the ownership, placement or control loop cannot break it.
            chaos:
              - 'cmd/sequence/**'
              - 'internal/sequence/biz/**'
              - 'internal/sequence/data/**'
              - 'internal/sequence/task/**'
              - 'internal/sequence/service/**'
              - 'internal/sequence/conf/**'
              - 'migrations/sequence/**'
              - 'tests/sequence/**'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'Taskfile.yml'
              - '.github/workflows/sequence-system-tests.yml'

  modules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gen/go/sequence/go.sum
            pkg/sequence/go.sum
      - uses: arduino/setup-task@v2
        with:
          version: 3.42.1
      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-sindri-tools-${{ hashFiles('Taskfile.yml') }}
      - name: Install pinned tools
        run: task tools:install
      - name: Run complete merge gate
        run: task verify
      - name: Verify the sequence release manifest
        run: task service-release:check SERVICE=sequence VERSION=v0.2.0 MODE=candidate

  integration-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gen/go/sequence/go.sum
            pkg/sequence/go.sum
      - uses: arduino/setup-task@v2
        with:
          version: 3.42.1
      - name: Run PostgreSQL sequence integration tests
        shell: bash
        run: |
          mkdir -p artifacts/sequence
          set -o pipefail
          task test:sequence:integration SEQUENCE_TEST_DIALECTS=postgres 2>&1 | tee artifacts/sequence/integration-postgres.log
      - name: Upload PostgreSQL sequence test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-integration-postgres-${{ github.run_id }}
          path: artifacts/sequence
          if-no-files-found: warn

  integration-mysql:
    if: github.event_name == 'pull_request' && needs.changes.outputs.mysql == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gen/go/sequence/go.sum
            pkg/sequence/go.sum
      - uses: arduino/setup-task@v2
        with:
          version: 3.42.1
      - name: Run MySQL sequence integration tests
        shell: bash
        run: |
          mkdir -p artifacts/sequence
          set -o pipefail
          task test:sequence:integration SEQUENCE_TEST_DIALECTS=mysql 2>&1 | tee artifacts/sequence/integration-mysql.log
      - name: Upload MySQL sequence test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-integration-mysql-${{ github.run_id }}
          path: artifacts/sequence
          if-no-files-found: warn

  chaos:
    # `always()` is what keeps the nightly and manual runs alive: the `changes` job
    # only runs for pull requests, so without it a skipped dependency would skip
    # chaos on every scheduled run too.
    needs: changes
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.chaos == 'true')
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gen/go/sequence/go.sum
            pkg/sequence/go.sum
      - uses: arduino/setup-task@v2
        with:
          version: 3.42.1
      - name: Run deterministic sequence chaos tests
        shell: bash
        run: |
          mkdir -p artifacts/sequence
          set -o pipefail
          task test:sequence:chaos SEQUENCE_TEST_DIALECTS=${{ matrix.dialect }} 2>&1 | tee artifacts/sequence/chaos-${{ matrix.dialect }}.log
      - name: Upload sequence test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-chaos-${{ matrix.dialect }}-${{ github.run_id }}
          path: artifacts/sequence
          if-no-files-found: warn
