syntax = "proto3";

package codesjoy.sindri.sequence.v1;

import "buf/validate/validate.proto";

// IDs are monotonic per key and may contain gaps
// after a process restart, route handoff, or idle state eviction.

option go_package = "github.com/codesjoy/sindri/gen/go/sequence/v1;sequencev1";

service SequenceGenerator {
  // Allocates a contiguous block of ids for key. route_version is the snapshot
  // used by the caller; an owner rejects stale or misrouted requests.
  rpc FetchNext(FetchNextRequest) returns (FetchNextResponse);

  // Allocates ids for a group of keys owned by the same sequence node.
  rpc FetchNextBatch(FetchNextBatchRequest) returns (FetchNextBatchResponse);

  // Returns the active route snapshot. known_version allows a cheap
  // not-modified response for SDK refresh loops.
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse);
}

message FetchNextRequest {
  string key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Omitted count defaults to one. Values are limited to keep range
  // reservations and retry gaps bounded.
  optional uint32 count = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 10000
  }];
}

message FetchNextResponse {
  // The first allocated id. The response covers [id, id + count - 1].
  int64 id = 1;
  uint32 count = 2;
  // The ownership epoch the block was allocated under. A caller that observes
  // this epoch decrease between two responses for the same key has proof of an
  // ordering violation, so the value is the client-visible half of the
  // linearization record.
  uint64 slot_epoch = 3;
}

message FetchNextBatchRequest {
  repeated FetchNextRequest requests = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
  }];
}

message FetchNextBatchResponse {
  // Results preserve the request order.
  repeated FetchNextBatchResult results = 1;
}

message FetchNextBatchResult {
  string key = 1;
  int64 id = 2;
  uint32 count = 3;
  // The ownership epoch this key's block was allocated under. A batch may span
  // several slots, so the epoch belongs to the result rather than the response.
  uint64 slot_epoch = 4;
}

message GetRouteRequest {
  int64 known_version = 1;
}

message GetRouteResponse {
  bool not_modified = 1;
  RouteSnapshot route = 2;
}

message RouteSnapshot {
  // The monotonically increasing directory revision of this ownership snapshot.
  int64 version = 1;
  reserved 2;
  reserved "nodes";
  // Identifies the slot layout the epochs were minted under: slot count and the
  // key-to-slot function. A caller must discard a cached snapshot whose layout
  // version differs, because the same slot number then means a different key.
  int64 layout_version = 3;
  // The authoritative ownership view, one entry per contiguous run of slots
  // sharing an owner instance and epoch. Slots owned by nobody are present with
  // an empty owner, so every slot is covered exactly once.
  repeated RouteSegment segments = 4;
}

message RouteSegment {
  uint32 start_slot = 1;
  uint32 end_slot = 2;
  // Empty when the slot is unowned; a caller must treat such a slot as paused
  // rather than as routed to the empty node.
  string owner_node_id = 3;
  string owner_instance_id = 4;
  // The ownership epoch of this segment. A caller compares it with the epoch on
  // responses and with its own cached snapshot to detect a takeover.
  uint64 slot_epoch = 5;
}
