syntax = "proto3";

package codesjoy.sindri.sequence.v1;

import "buf/validate/validate.proto";

// IDs are monotonic per key and may contain gaps
// after a process restart, route handoff, or idle state eviction.

option go_package = "github.com/codesjoy/sindri/gen/go/sequence/v1;sequencev1";

service SequenceGenerator {
  // Allocates a contiguous block of ids for key. route_version is the snapshot
  // used by the caller; an owner rejects stale or misrouted requests.
  rpc FetchNext(FetchNextRequest) returns (FetchNextResponse);

  // Allocates ids for a group of keys owned by the same sequence node.
  rpc FetchNextBatch(FetchNextBatchRequest) returns (FetchNextBatchResponse);

  // Returns the active route snapshot. known_version allows a cheap
  // not-modified response for SDK refresh loops.
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse);
}

message FetchNextRequest {
  string key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Omitted count defaults to one. Values are limited to keep range
  // reservations and retry gaps bounded.
  optional uint32 count = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 10000
  }];
}

message FetchNextResponse {
  // The first allocated id. The response covers [id, id + count - 1].
  int64 id = 1;
  uint32 count = 2;
}

message FetchNextBatchRequest {
  repeated FetchNextRequest requests = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
  }];
}

message FetchNextBatchResponse {
  // Results preserve the request order.
  repeated FetchNextBatchResult results = 1;
}

message FetchNextBatchResult {
  string key = 1;
  int64 id = 2;
  uint32 count = 3;
}

message GetRouteRequest {
  int64 known_version = 1;
}

message GetRouteResponse {
  bool not_modified = 1;
  RouteSnapshot route = 2;
}

message RouteSnapshot {
  int64 version = 1;
  repeated RouteNode nodes = 2;
}

message RouteNode {
  string node_id = 1;
  repeated uint32 slots = 2;
}
