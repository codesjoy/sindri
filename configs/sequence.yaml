yggdrasil:
  mode: dev
  admin:
    governor: {bind: "0.0.0.0", port: 8080}
  observability:
    telemetry:
      tracer: otlp-grpc
      meter: otlp-grpc
      providers:
        otlp:
          trace: {endpoint: localhost:4317, tls: {insecure: true}}
          metric: {endpoint: localhost:4317, tls: {insecure: true}}
  server:
    transports: [grpc]
    interceptors: {unary: [protovalidate]}
  transports:
    grpc:
      server: {address: ":19010"}

app:
  sequence:
    database:
      driver: postgres
      dsn: "${SKULD_SEQUENCE_DSN}"
      expected_database: skuld_sequence
      expected_account: skuld_sequence
      max_open_conns: 20
      max_idle_conns: 5
      conn_max_lifetime: 30m
    allocator:
      step: 100
    node:
      id: "${SKULD_SEQUENCE_NODE_ID}"
      heartbeat_timeout_ticks: 3
      route_query_timeout: 1s
    ticker:
      base_tick_interval: 1s
      heartbeat_ticks: 1
