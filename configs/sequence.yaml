yggdrasil:
  mode: dev
  admin:
    governor: {bind: "127.0.0.1", port: 8080, expose_pprof: true}
  observability:
    telemetry:
      tracer: otlp-grpc
      meter: otlp-grpc
      providers:
        otlp:
          trace: {endpoint: "${SKULD_OTLP_ENDPOINT}", tls: {insecure: true}}
          metric: {endpoint: "${SKULD_OTLP_ENDPOINT}", tls: {insecure: true}}
  server:
    transports: [grpc]
    interceptors: {unary: [protovalidate]}
  transports:
    grpc:
      server: {address: ":19010"}

app:
  sequence:
    runtime:
      memory_limit: auto
      auto_memory_limit_ratio: 0.8
    database:
      driver: "${SKULD_SEQUENCE_DRIVER}"
      dsn: "${SKULD_SEQUENCE_DSN}"
      expected_database: skuld_sequence
      expected_account: skuld_sequence
      max_open_conns: 20
      max_idle_conns: 5
      conn_max_lifetime: 30m
    allocator:
      default_step: 100
      max_step: 10000
      prefetch_ratio: 0.5
      step_increase_threshold: 15m
      step_decrease_threshold: 30m
      reserve_timeout: 1s
      idle_timeout: 24h
      cleanup_interval: 1s
      cleanup_slots_per_run: 64
      memory_high_watermark_ratio: 0.9
    node:
      id: "${SKULD_SEQUENCE_NODE_ID}"
      heartbeat_timeout_ticks: 3
      route_query_timeout: 1s
    ticker:
      base_tick_interval: 1s
      heartbeat_ticks: 1
